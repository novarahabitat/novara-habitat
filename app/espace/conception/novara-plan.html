<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NOVARA Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6E9EB;--panel:#F7F8F8;--ink:#1C252D;--muted:#5B6873;--line:#CDD3D8;--canvas:#FCFCFB;--grid:#ECEFF1;--grid2:#D3D9DE;--wall:#28313A;--accent:#F2B705;--sel:#1F6FE0;--danger:#B93C10;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11161A;--panel:#1A2127;--ink:#E4E9ED;--muted:#8E9BA6;--line:#2C353D;--canvas:#0E1317;--grid:#161D22;--grid2:#252E35;--wall:#C7D0D8;--sel:#5A9CF5;--danger:#F0835A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11161A;--panel:#1A2127;--ink:#E4E9ED;--muted:#8E9BA6;--line:#2C353D;--canvas:#0E1317;--grid:#161D22;--grid2:#252E35;--wall:#C7D0D8;--sel:#5A9CF5;--danger:#F0835A;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer;white-space:nowrap}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
button.on,button.primary{background:var(--accent);border-color:var(--accent);color:#1C252D;font-weight:600}
button:disabled{opacity:.4;cursor:default}
button.danger{color:var(--danger);border-color:currentColor}
.bar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-size:16px;letter-spacing:.02em}
.brand b{font-weight:700}
.tools{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.acts{display:flex;gap:4px;margin-left:auto}
.tabs{display:none}
.tabs button{border-radius:0}
.tabs button:first-child{border-radius:7px 0 0 7px}
.tabs button:last-child{border-radius:0 7px 7px 0;border-left:0}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 280px}
.pane{position:relative;min-width:0;min-height:0;overflow:hidden}
.plan{border-right:1px solid var(--line)}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
#view3d{position:absolute;inset:0;touch-action:none;cursor:grab}
#view3d canvas{display:block}
.hint{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
.hint>*{pointer-events:auto}
#hintText{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--muted);font-size:13px;max-width:100%}
#lenBox{display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:4px 6px;font-size:13px}
#lenBox input{width:62px;padding:5px 6px}
#lenBox button{padding:4px 8px}
.corner{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.corner button{background:var(--panel)}
.vctl{position:absolute;left:10px;right:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.vctl label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.vctl output{min-width:38px;color:var(--ink)}
.vctl input[type=range]{width:96px;accent-color:var(--accent)}
.seg{display:flex}
.seg button{border-radius:0}
.seg button:first-child{border-radius:7px 0 0 7px}
.seg button:last-child{border-radius:0 7px 7px 0;border-left:0}
.vctl .primary{margin-left:auto}
.pad{position:absolute;right:14px;top:14px;display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,46px);gap:4px;user-select:none;-webkit-user-select:none}
.pad button{background:var(--panel);padding:0;font-size:18px;touch-action:none}
.pad [data-move=f]{grid-column:2;grid-row:1}
.pad [data-move=l]{grid-column:1;grid-row:2}
.pad [data-move=b]{grid-column:2;grid-row:2}
.pad [data-move=r]{grid-column:3;grid-row:2}
.walkhint{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 10px;color:var(--muted);font-size:13px;max-width:calc(100% - 180px)}
#insp{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 14px 28px}
#insp h2{font-size:16px;margin:0 0 10px;font-weight:700}
#insp h3{font-size:13px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0}
.f>span:first-child{color:var(--muted);font-size:13px}
.inp{display:flex;align-items:center;gap:4px}
input{font:inherit;color:var(--ink);background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:80px}
input[data-f=rname]{width:150px}
.inp em{font-style:normal;color:var(--muted);font-size:12px;min-width:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:32px;height:32px;padding:0;border-radius:50%;border:1px solid var(--line)}
.sw button.cur{outline:2px solid var(--sel);outline-offset:2px}
.list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.list button{text-align:left;white-space:normal;padding:8px;line-height:1.25}
.list small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.list button[data-act=cat],.list button[data-act=eq]{touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.viewsel{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
select{font:inherit;color:var(--ink);background:var(--canvas);border:1px solid var(--line);border-radius:7px;padding:6px 8px}
.ebox{background:var(--panel);border-radius:12px;width:min(1200px,100%);max-height:100%;overflow:auto;padding:0 16px 20px}
.ehead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--panel);padding:14px 0 10px;z-index:2;border-bottom:1px solid var(--line)}
.ehead h2{margin:0;font-size:18px}.ehead .row{margin:0}
.egrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 24px}
.ebox h3{font-size:13px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.chk{display:flex;gap:8px;align-items:center;margin:7px 0}.chk input{width:auto}
.tablewrap,.svgwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.svgwrap{background:#fff;padding:8px}.svgwrap svg{display:block}
table.ct{border-collapse:collapse;width:100%;font-size:13px}
.ct th,.ct td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ct th{color:var(--muted);font-weight:600}
.ct input{width:200px}.ct input.pts{width:56px}.ct select{padding:4px 6px}
.ck{margin:5px 0;padding:6px 10px;border-radius:6px;font-size:13px;background:var(--canvas);border-left:4px solid var(--line)}
.ck.err{border-left-color:#e03131}.ck.warn{border-left-color:#f08c00}.ck.info{border-left-color:#1c7ed6}.ck.ok{border-left-color:#2f9e44}
.ebox input.wide,.ebox textarea{width:100%}
.ebox textarea{font:inherit;color:var(--ink);background:var(--canvas);border:1px solid var(--line);border-radius:6px;padding:8px;min-height:64px;resize:vertical}
.ebox h4{margin:14px 0 4px;font-size:14px}
.fl{display:block;margin:8px 0}.fl span{display:block;color:var(--muted);font-size:13px;margin-bottom:3px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:10px}
.th img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;display:block;border:1px solid var(--line)}
.th input{width:100%;margin-top:6px}.th button{margin-top:6px;width:100%}
.filebtn{display:inline-block;border:1px solid var(--line);border-radius:7px;padding:7px 11px;cursor:pointer}
.projbtn{max-width:240px;overflow:hidden;text-overflow:ellipsis}
.projbtn span{font-weight:600}
.pjrow{border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;display:flex;flex-direction:column;gap:4px}
.pjrow.cur{border-color:var(--accent);border-width:2px}.pjrow small{color:var(--muted)}.pjrow .row{margin-top:4px}
.ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-130%);background:var(--accent);color:#1C252D;font-weight:600;padding:6px 10px;border-radius:7px;font-size:13px;white-space:nowrap}
.list button.on small{color:#3B4650}
.note{color:var(--muted);font-size:13px;margin:10px 0 0}
.stat{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);gap:10px}
.stat span{color:var(--muted)}
.stat b{font-size:17px;font-weight:600;white-space:nowrap}
.stat.small b{font-size:14px}
.modal{position:fixed;inset:0;background:rgba(10,14,18,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.mbox{background:var(--panel);border-radius:12px;padding:12px;max-width:min(1200px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px}
.mbox img{max-width:100%;max-height:72vh;object-fit:contain;border-radius:6px;display:block}
.mbox p{margin:0;color:var(--muted);font-size:13px}
.mbox .row{margin:0;justify-content:flex-end}
.glerr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
@media (max-width:1100px){
  .bar{gap:8px;padding:8px}
  .brand{order:0}.projbtn{order:0}.acts{order:1}.tabs{order:2;display:flex}.tools{order:3;width:100%}.viewsel{order:4}
  .acts button{padding:7px 9px}
  main{grid-template-columns:minmax(0,1fr) 270px}
  .pane{display:none;grid-column:1;grid-row:1}
  body[data-tab=plan] .plan,body[data-tab=view] .view{display:block}
  .plan{border-right:0}
  #insp{grid-column:2;grid-row:1}
  .vctl input[type=range]{width:72px}
  .vctl .primary{margin-left:0}
}
@media (max-width:640px){
  main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  #insp{grid-column:1;grid-row:2;border-left:0;border-top:1px solid var(--line);max-height:36vh}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body data-tab="plan">
<header class="bar">
  <div class="brand"><b>NOVARA</b> Plan</div>
  <button id="projBtn" class="projbtn" title="Chantiers : ouvrir, créer, exporter">Chantier : <span id="projName"></span></button>
  <nav class="tools" id="tools" aria-label="Outils">
    <button data-tool="select" class="on">Sélection</button>
    <button data-tool="room">Pièce</button>
    <button data-tool="wall">Mur</button>
    <button data-tool="door">Porte</button>
    <button data-tool="window">Fenêtre, niche</button>
    <button data-tool="item">Meuble</button>
    <button data-tool="net">Réseaux</button>
  </nav>
  <label class="viewsel">Niveau <select id="lvlSel"></select></label>
  <label class="viewsel">Vue <select id="viewSel"><option value="plan">Plan meublé</option><option value="vide">Sans meubles</option><option value="all">Tous les réseaux</option><option value="elec">Électricité</option><option value="domo">Domotique</option><option value="eau">Eau</option><option value="air">Air (VMC)</option><option value="chauf">Chauffage</option><option value="jardin">Extérieur et jardin</option></select></label>
  <div class="acts">
    <button id="elecBtn" title="Tableau électrique et schéma unifilaire">Tableau élec.</button>
    <button id="packBtn" title="Dossier à remettre au client">Pack client</button>
    <button id="undoBtn" title="Annuler (Ctrl+Z)">Annuler</button>
    <button id="delBtn" title="Supprimer (Suppr)" disabled>Supprimer</button>
  </div>
  <div class="tabs" id="tabs"><button data-tab="plan" class="on">Plan</button><button data-tab="view">3D</button></div>
</header>
<main id="work">
  <section class="pane plan" id="planPane" aria-label="Plan 2D">
    <canvas id="plan"></canvas>
    <div class="hint">
      <span id="hintText"></span>
      <span id="lenBox" hidden>
        <label>Longueur <input id="lenIn" inputmode="decimal" placeholder="3,20" aria-label="Longueur en mètres"> m</label>
        <button data-dir="l" aria-label="Vers la gauche">←</button><button data-dir="u" aria-label="Vers le haut">↑</button><button data-dir="d" aria-label="Vers le bas">↓</button><button data-dir="r" aria-label="Vers la droite">→</button>
      </span>
      <button id="orthoBtn" class="on" hidden title="Bloquer les angles droits">Angles droits</button>
      <button id="finishBtn" hidden>Terminer</button>
    </div>
    <div class="corner"><button id="fitBtn">Recentrer</button></div>
  </section>
  <section class="pane view" id="viewPane" aria-label="Vue 3D">
    <div id="view3d"></div>
    <div class="walkhint" id="walkHint" hidden>Glissez pour regarder. Flèches ou Z Q S D pour marcher.</div>
    <div class="pad" id="pad" hidden>
      <button data-move="f" aria-label="Avancer">▲</button><button data-move="l" aria-label="Tourner à gauche">◀</button><button data-move="b" aria-label="Reculer">▼</button><button data-move="r" aria-label="Tourner à droite">▶</button>
    </div>
    <div class="vctl">
      <div class="seg"><button data-cam="orbit" class="on">Maquette</button><button data-cam="walk">Visite</button></div>
      <label>Heure <input type="range" id="hour" min="6" max="20" step="0.25" value="15"><output id="hourOut">15h00</output></label>
      <label>Niveaux <select id="lvl3d"><option value="below">Jusqu’à l’actuel</option><option value="cur">Actuel seul</option><option value="all">Tous</option></select></label>
      <label>Nord <input type="range" id="north" min="0" max="355" step="5" value="0"></label>
      <button id="photoBtn" class="primary">Photo HD</button>
    </div>
  </section>
  <aside id="insp" aria-label="Propriétés"></aside>
</main>
<div class="modal" id="elecModal" hidden>
  <div class="ebox">
    <div class="ehead"><h2>Tableau électrique</h2><div class="row"><button id="elecGen">Générer depuis le plan</button><button id="elecSvg">Schéma en SVG</button><button id="elecExport" class="primary">Exporter le dossier</button><button id="elecClose">Fermer</button></div></div>
    <div id="elecBody"></div>
  </div>
</div>
<div class="modal" id="projModal" hidden>
  <div class="ebox">
    <div class="ehead"><h2>Chantiers</h2><div class="row"><button id="projClose">Fermer</button></div></div>
    <div id="projBody"></div>
  </div>
</div>
<div class="modal" id="packModal" hidden>
  <div class="ebox">
    <div class="ehead"><h2>Pack client</h2><div class="row"><button id="packExport" class="primary">Exporter le pack client</button><button id="packClose">Fermer</button></div></div>
    <div id="packBody"></div>
  </div>
</div>
<div class="modal" id="modal" hidden>
  <div class="mbox">
    <img id="shot" alt="Rendu 3D du projet">
    <p>Clic droit ou appui long sur l’image pour l’enregistrer.</p>
    <div class="row"><button id="closeModal">Fermer</button></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(p,q)=>Math.hypot(p.x-q.x,p.y-q.y);
const r5=v=>Math.round(v/0.05)*0.05;

const fmt=(v,d=2)=>(Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toFixed(d).replace('.',',');
const num=v=>parseFloat(String(v).replace(',','.'));

/* ---------- Données ---------- */
let M={walls:[],rooms:[],items:[],nets:[],eqs:[]};let PROJ=null,printMode=false,lvDelArmed=false,zoneMode=false;
const S={thick:0.2,height:2.5,wallColor:'#EDEBE6',hour:15,north:0,ortho:true};
let uid=1;const nid=p=>p+(uid++);
let tool='select',sel=null,drawPts=[],cursor=null,itemType='canape',winPreset='fenetre',doorPreset='porte',clearArmed=false;
let vmode='plan',curNet='elec',curH=4,eqArm=null,curLine=null;
const undoStack=[];
const OPEN={porte:{type:'door',w:.83,h:2.04,sill:0,n:'Porte intérieure'},entree:{type:'door',w:.93,h:2.15,sill:0,n:'Porte d’entrée'},fenetre:{type:'window',w:1.2,h:1.25,sill:.95,n:'Fenêtre'},pf:{type:'window',w:.9,h:2.15,sill:0,n:'Porte-fenêtre'},baie:{type:'window',w:2.4,h:2.15,sill:0,n:'Baie vitrée'},niche:{type:'niche',w:.6,h:.4,sill:1.2,depth:.1,n:'Niche murale'},garage:{type:'gdoor',w:2.4,h:2.0,sill:0,n:'Porte de garage'}};
const FLOORS={parquet:{n:'Parquet chêne',plan:'rgba(196,146,88,.20)',r:.55,size:2.4},parquet_fonce:{n:'Parquet noyer',plan:'rgba(120,80,50,.22)',r:.5,size:2.4},carrelage:{n:'Carrelage clair 60×60',plan:'rgba(150,160,170,.16)',r:.22,size:1.2},carrelage_fonce:{n:'Carrelage anthracite',plan:'rgba(70,75,82,.22)',r:.25,size:1.2},beton:{n:'Béton ciré',plan:'rgba(140,138,132,.20)',r:.45,size:3},pelouse:{n:'Pelouse',plan:'rgba(64,160,64,.24)',r:.95,size:3},terrasse_bois:{n:'Terrasse bois',plan:'rgba(150,110,70,.22)',r:.7,size:2.4},gravier:{n:'Gravier',plan:'rgba(190,175,150,.28)',r:.95,size:2},pave:{n:'Pavés',plan:'rgba(120,120,125,.22)',r:.8,size:1.2}};
const NETS={elec:{n:'Électricité',g:'elec',c:'#F08C00',r:.011},domo:{n:'Bus domotique',g:'domo',c:'#7C4DFF',r:.007},ef:{n:'Eau froide',g:'eau',c:'#1C7ED6',r:.01},ec:{n:'Eau chaude',g:'eau',c:'#E03131',r:.01},eu:{n:'Évacuation eaux usées',g:'eau',c:'#8B6B4A',r:.025},vs:{n:'VMC air neuf / soufflage',g:'air',c:'#15AABF',r:.07},ve:{n:'VMC extraction / rejet',g:'air',c:'#74B816',r:.07},tpc:{n:'Câble enterré (gaine TPC)',g:'elec',c:'#C92A2A',r:.02},arro:{n:'Tuyau d’arrosage enterré',g:'eau',c:'#0CA678',r:.012},perim:{n:'Fil périmétrique du robot',g:'jardin',c:'#94D82D',r:.005},cd:{n:'Chauffage départ',g:'chauf',c:'#C2255C',r:.011},cr:{n:'Chauffage retour',g:'chauf',c:'#F06595',r:.011}};
const GROUPS={elec:'Électricité',domo:'Domotique',eau:'Eau',air:'Air (VMC)',chauf:'Chauffage',jardin:'Extérieur et jardin'};
const GCOL={elec:'#F08C00',domo:'#7C4DFF',eau:'#1C7ED6',air:'#15AABF',chauf:'#C2255C',jardin:'#2F9E44'};
const DESCK=[['struct','Structure et niveaux'],...Object.entries(GROUPS)];
const HEIGHTS=[['Enterré',-.5],['Sol',.05],['Bas de mur',.3],['Mi-hauteur',1.1],['Plafond',-.12,'ceil']];
const EQ={
 arrivee_elec:{n:'Arrivée électrique',c:'AE',g:'elec',z:0,wall:false,m:['floorbox']},
 linky:{n:'Compteur Linky',c:'LK',g:'elec',z:1.5,wall:true,m:['box',.2,.3,.08,'#eef0e8']},
 tableau:{n:'Tableau électrique',c:'TB',g:'elec',z:1.3,wall:true,m:['box',.55,.75,.12,'#f2f2f0'],big:true},
 prise:{n:'Prise de courant',c:'PC',g:'elec',z:.3,wall:true,m:['plate']},
 inter:{n:'Interrupteur',c:'I',g:'elec',z:1.1,wall:true,m:['plate']},
 lumiere:{n:'Point lumineux',c:'PL',g:'elec',z:'ceil',wall:false,m:['ceil']},
 applique:{n:'Applique murale',c:'AP',g:'elec',z:1.8,wall:true,m:['box',.15,.15,.08,'#f5f2e8']},
 rj45:{n:'Prise réseau RJ45',c:'RJ',g:'elec',z:.3,wall:true,m:['plate']},

/* ---------- Géométrie ---------- */
function wInfo(w){const dx=w.b.x-w.a.x,dy=w.b.y-w.a.y,L=Math.hypot(dx,dy)||1e-9,u={x:dx/L,y:dy/L};return{L,u,n:{x:-u.y,y:u.x}};}
function proj(w,p){const{L,u}=wInfo(w),vx=p.x-w.a.x,vy=p.y-w.a.y;return{s:vx*u.x+vy*u.y,d:-vx*u.y+vy*u.x,L};}
function addWall(a,b){M.walls.push({id:nid('w'),a:{x:r3(a.x),y:r3(a.y)},b:{x:r3(b.x),y:r3(b.y)},thick:S.thick,height:S.height,openings:[]});}
function addWallSmart(a,b){
  const L=dist(a,b);if(L<0.05)return;
  const u={x:(b.x-a.x)/L,y:(b.y-a.y)/L};
  const off=p=>Math.abs((p.x-a.x)*u.y-(p.y-a.y)*u.x),along=p=>(p.x-a.x)*u.x+(p.y-a.y)*u.y;
  const cov=[];
  for(const w of M.walls){if(off(w.a)<0.02&&off(w.b)<0.02){let s1=along(w.a),s2=along(w.b);if(s1>s2)[s1,s2]=[s2,s1];s1=Math.max(0,s1);s2=Math.min(L,s2);if(s2-s1>0.01)cov.push([s1,s2]);}}
  cov.sort((x,y)=>x[0]-y[0]);
  const pt=s=>({x:a.x+u.x*s,y:a.y+u.y*s});let cur=0;
  for(const[s1,s2]of cov){if(s1-cur>0.05)addWall(pt(cur),pt(s1));cur=Math.max(cur,s2);}
  if(L-cur>0.05)addWall(pt(cur),b);
}
function createRoom(pts,zone){const P=pts.map(p=>({x:r3(p.x),y:r3(p.y)}));if(!zone)for(let i=0;i<P.length;i++)addWallSmart(P[i],P[(i+1)%P.length]);M.rooms.push({id:nid('r'),name:zone?'Zone extérieure':'Pièce '+(M.rooms.length+1),floor:zone?'pelouse':'parquet',pts:P,zone:!!zone});}
function polyArea(P){let a=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length];a+=p.x*q.y-q.x*p.y;}return Math.abs(a)/2;}
function polyPerim(P){let s=0;for(let i=0;i<P.length;i++)s+=dist(P[i],P[(i+1)%P.length]);return s;}

function lvlBounds(L){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;L.data.walls.forEach(w=>[w.a,w.b].forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}));if(!isFinite(x0))return{x0:0,y0:0,x1:1,y1:1};return{x0,y0,x1,y1};}
function heightAt(L,B,x,y){const r=L.roof;if(!r)return L.height;const a=r.dir==='x'?B.y0:B.x0,b=r.dir==='x'?B.y1:B.x1,v=r.dir==='x'?y:x,half=(b-a)/2;if(half<=0)return r.ridge;return r.knee+(r.ridge-r.knee)*clamp(Math.min(v-a,b-v)/half,0,1);}
const SFC=new Map();
function slopeFrac(r,L){if(!L||!L.roof)return 1;const B=lvlBounds(L),key=JSON.stringify([L.roof,B,r.pts]);if(SFC.has(key))return SFC.get(key);
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;r.pts.forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);});
  const st=Math.max(.05,Math.sqrt((x1-x0)*(y1-y0)/2500));let n=0,ok=0;for(let x=x0+st/2;x<x1;x+=st)for(let y=y0+st/2;y<y1;y+=st){if(!pip({x,y},r.pts))continue;n++;if(heightAt(L,B,x,y)>=1.8)ok++;}
  const f=n?ok/n:1;if(SFC.size>500)SFC.clear();SFC.set(key,f);return f;}

function centroid(P){let a=0,x=0,y=0;for(let i=0;i<P.length;i++){const p=P[i],q=P[(i+1)%P.length],c=p.x*q.y-q.x*p.y;a+=c;x+=(p.x+q.x)*c;y+=(p.y+q.y)*c;}if(Math.abs(a)<1e-9){let sx=0,sy=0;P.forEach(p=>{sx+=p.x;sy+=p.y;});return{x:sx/P.length,y:sy/P.length};}return{x:x/(3*a),y:y/(3*a)};}
function pip(p,P){let ins=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a.y>p.y)!==(b.y>p.y))&&(p.x<(b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x))ins=!ins;}return ins;}

function bounds(){let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;const add=p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);};M.walls.forEach(w=>{add(w.a);add(w.b);});M.rooms.forEach(r=>r.pts.forEach(add));M.items.forEach(add);(M.eqs||[]).forEach(add);(M.nets||[]).forEach(l=>l.pts.forEach(add));if(!isFinite(x0)){x0=-4;y0=-3;x1=4;y1=3;}if(x1-x0<2){x0-=1;x1+=1;}if(y1-y0<2){y0-=1;y1+=1;}return{x0,y0,x1,y1,cx:(x0+x1)/2,cy:(y0+y1)/2,size:Math.max(x1-x0,y1-y0)};}

  if(tool==='door'||tool==='window'){placeOpening(wp);return;}
  if(tool==='item'){snapshot();const it={id:nid('i'),type:itemType,x:r3(r5(wp.x)),y:r3(r5(wp.y)),rot:0};M.items.push(it);syncPorts(it);setTool('select');sel={kind:'item',it};changed();return;}

    updateHint();drawPlan();return;}

const HINTS={select:'Glissez un élément pour le déplacer. Tirez un mur pour l’avancer ou le reculer. Double-clic sur un mur : ajoute un angle.',room:'Glissez pour tracer une pièce rectangulaire, ou cliquez chaque angle pour une forme libre.',wall:'Cliquez pour poser chaque extrémité du mur. Double-clic ou « Terminer » pour arrêter.',door:'Cliquez sur un mur pour poser la porte, du côté où elle doit s’ouvrir.',window:'Cliquez sur un mur pour poser la fenêtre ou la niche, du côté voulu.',item:'Glissez un meuble du panneau jusqu’au plan, ou choisissez-le puis cliquez dans le plan.',net:'Choisissez un réseau puis cliquez point par point. Ou choisissez un équipement et touchez le plan.'};
function updateHint(){
  const drawing=(tool==='wall'||tool==='room'||tool==='net');
  $('#hintText').textContent=drawing&&drawPts.length?(tool==='room'?'Point suivant, ou tapez une longueur. Revenez au premier point pour fermer.':'Point suivant, ou tapez une longueur puis Entrée.'):(tool==='net'&&eqArm?'Touchez le plan pour poser : '+EQ[eqArm].n+'. Touchez de nouveau la carte pour arrêter.':HINTS[tool]);
  $('#lenBox').hidden=!(drawing&&drawPts.length);$('#finishBtn').hidden=!drawPts.length;$('#orthoBtn').hidden=!drawing;
  $('#finishBtn').textContent=tool==='room'?'Fermer la pièce':'Terminer';
}

insp.addEventListener('change',e=>{if(e.target.id==='qzone'){zoneMode=e.target.checked;return;}if(e.target.id==='qrw'||e.target.id==='qrl'||e.target.id==='qrt')return;if(e.target.dataset.lv){levelField(e.target.dataset.lv,e.target.value);return;}const k=e.target.dataset.f;if(!k)return;const raw=e.target.value,v=num(raw);
  if(k==='rname'&&sel&&sel.r){snapshot();sel.r.name=raw.trim()||sel.r.name;changed();return;}
  if(!(v>=0)&&!((k==='lz'||k==='ez')&&v>=-3)){renderInspector();return;}
  if(k==='defthick'){S.thick=clamp(v,.05,.6);save();renderInspector();return;}
  if(k==='defh'){S.height=clamp(v,1.8,6);save();renderInspector();return;}
  snapshot();
  if(sel&&sel.kind==='wall'){const w=sel.w;
    if(k==='wlen'&&v>.1){const{u}=wInfo(w);const nb={x:r3(w.a.x+u.x*v),y:r3(w.a.y+u.y*v)};refsAt(w.b).forEach(o=>{o.x=nb.x;o.y=nb.y;});}
    if(k==='wthick')w.thick=clamp(v,.05,.8);if(k==='wh')w.height=clamp(v,.3,8);}
  else if(sel&&sel.kind==='open'){const o=sel.o,L=wInfo(sel.w).L;
    if(k==='ow')o.w=clamp(v,.3,L-.1);if(k==='oh')o.h=clamp(v,.2,sel.w.height-(o.type!=='door'?o.sill:0));if(k==='osill')o.sill=clamp(v,0,sel.w.height-o.h);if(k==='opos')o.t=v+o.w/2;if(k==='odepth')o.depth=clamp(v,.01,sel.w.thick-.02);
    o.t=clamp(o.t,o.w/2+.05,Math.max(o.w/2+.05,L-o.w/2-.05));}
  else if(sel&&sel.kind==='eq'){if(k==='ez')sel.e.z=clamp(v,-3,8);}
  else if(sel&&sel.kind==='net'){if(k==='lz')sel.l.pts.forEach(q=>{q.z=clamp(v,-3,8);});}
  else if(sel&&sel.kind==='item'){if(sel.it.emb)unembed(sel.it,false);if(k==='ix')sel.it.x=r3(v);if(k==='iy')sel.it.y=r3(v);syncPorts(sel.it);}
  changed();});
insp.addEventListener('click',e=>{if(ignoreClick)return;const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a!=='clear')clearArmed=false;if(a!=='lvdel')lvDelArmed=false;
  if(a==='lvup'||a==='lvdown'){addLevel(a==='lvup');return;}
  if(a==='lvcopy'){copyBelow();return;}
  if(a==='lvext'){PROJ.levels.push(mkLevel('ext','Extérieur',2.5));switchLevel(PROJ.levels.length-1);return;}
  if(a==='lvdel'){if(!lvDelArmed){lvDelArmed=true;return renderInspector();}lvDelArmed=false;delLevel();return;}
  if(a==='projects'){openProjModal();return;}
  if(a==='qroom'){const w=clamp(num($('#qrw').value)||0,.5,60),l=clamp(num($('#qrl').value)||0,.5,60),ty=$('#qrt')?$('#qrt').value:'piece';const has=M.walls.length>0||M.rooms.length>0,b=bounds(),x0=has?r5(b.x1+1):0,y0=has?r5(b.y0):0;
    const pts=[{x:x0,y:y0},{x:x0+w,y:y0},{x:x0+w,y:y0+l},{x:x0,y:y0+l}];snapshot();const kt=S.thick,kh=S.height;if(ty==='cabanon'){S.thick=.1;S.height=Math.min(S.height,2.2);}
    createRoom(pts,ty==='zone');S.thick=kt;S.height=kh;const r=M.rooms[M.rooms.length-1];r.name={piece:'Pièce',garage:'Garage',cabanon:'Cabanon de jardin',dependance:'Dépendance',zone:'Jardin'}[ty]||'Pièce';
    const w0=wallAt(r3(x0),r3(y0),r3(x0+w),r3(y0));if(ty==='garage'){r.floor='beton';if(w>=2.7)addOp(w0,'garage',w/2);}if(ty==='cabanon'){r.floor='terrasse_bois';if(w>=1.1)addOp(w0,'porte',w/2,-1);}
    setTool('select');changed();fitPlan();return;}
  if(a==='del')return deleteSel();
  if(a==='split'){const w=sel.w;if(splitWall(w,{x:(w.a.x+w.b.x)/2,y:(w.a.y+w.b.y)/2})){sel=null;changed();flash('Angle ajouté : tirez une des deux parties du mur.');}return;}
  if(a==='floor'){snapshot();sel.r.floor=v;return changed();}
  if(a==='rot'){snapshot();if(sel.it.emb)unembed(sel.it,true);sel.it.rot=((sel.it.rot+Number(v))%360+360)%360;syncPorts(sel.it);return changed();}
  if(a==='net'){curNet=v;eqArm=null;drawPts=[];curLine=null;if(vmode!=='all'&&vmode!==NETS[v].g)setView(NETS[v].g,true);pending3D=true;updateHint();renderInspector();return drawPlan();}
  if(a==='nh'){curH=Number(v);return renderInspector();}
  if(a==='eq'){eqArm=eqArm===v?null:v;drawPts=[];curLine=null;updateHint();renderInspector();return drawPlan();}
  if(a==='lnet'){snapshot();sel.l.net=v;return changed();}
  if(a==='evol'){snapshot();sel.e.vol=Number(v);return changed();}
  if(a==='ebox'){snapshot();sel.e.box=!sel.e.box;return changed();}
  if(a==='erot'){snapshot();sel.e.rot=((sel.e.rot||0)+90)%360;return changed();}
  if(a==='embed'){snapshot();const msg=embed(sel.it,v);syncPorts(sel.it);changed();if(msg)flash(msg);return;}
  if(a==='unembed'){snapshot();unembed(sel.it,true);syncPorts(sel.it);return changed();}
  if(a==='thk'){const v2=Number(v);if(sel&&sel.kind==='wall'){snapshot();sel.w.thick=v2;sel.w.openings.forEach(o=>{if(o.type==='niche')o.depth=Math.min(o.depth,v2-.02);});return changed();}S.thick=v2;save();return renderInspector();}
  if(a==='dup'){snapshot();const it=Object.assign({},sel.it,{id:nid('i'),x:r3(sel.it.x+.3),y:r3(sel.it.y+.3)});delete it.emb;M.items.push(it);syncPorts(it);sel={kind:'item',it};return changed();}
  if(a==='flipside'){snapshot();sel.o.side=-(sel.o.side||1);return changed();}
  if(a==='fliphinge'){snapshot();sel.o.hinge=sel.o.hinge?0:1;return changed();}
  if(a==='wallcolor'){S.wallColor=v;if(MAT.paint){MAT.paint.color.copy(col(v));needRender=true;}save();return renderInspector();}
  if(a==='applyh'){snapshot();M.walls.forEach(w=>w.height=S.height);return changed();}
  if(a==='demo'){snapshot();demo();sel=null;changed();fitPlan();fit3D();return;}
  if(a==='clear'){if(!clearArmed){clearArmed=true;return renderInspector();}clearArmed=false;snapshot();setM({walls:[],rooms:[],items:[],nets:[],eqs:[]});sel=null;changed();return;}
  if(a==='cat'){itemType=v;return renderInspector();}
  if(a==='preset'){if(tool==='door')doorPreset=v;else winPreset=v;renderInspector();drawPlan();}
});
let catDrag=null,ghost=null,ignoreClick=false;

    if(xr){M.nets.forEach(l=>{if(NETS[l.net]&&netVis(NETS[l.net].g))buildNet(l);});M.eqs.forEach(e=>{if(EQ[e.type]&&netVis(EQ[e.type].g))buildEq(e);});}else M.eqs.forEach(e=>{if(EQ[e.type]&&EQ[e.type].big)buildEq(e);});
    if(L.roof&&L.data.walls.length)buildRoof(L);
    buildRoot.add(buildGroup);});}
  finally{M=keepM;BL=null;WALLMATS=BASEW;PAINTMATS=MAT.paint;buildGroup=buildRoot;}
  scene.add(buildRoot);groundMesh.visible=minE>-.05;fitShadow();renderer.shadowMap.needsUpdate=true;needRender=true;}
function fitShadow(){const b=bounds(),half=b.size/2+3,c=sun.shadow.camera;c.left=-half;c.right=half;c.top=half;c.bottom=-half;c.near=.5;c.far=half*6+60;c.updateProjectionMatrix();updateSun();}
function updateSun(){if(!gl3)return;const b=bounds(),h=S.hour,a=(h-6)/14*Math.PI,sa=Math.sin(a),el=.06+Math.max(0,sa)*.92;
  let x=Math.cos(a)*Math.cos(el),z=sa*Math.cos(el);const n=S.north*Math.PI/180,rx=x*Math.cos(n)-z*Math.sin(n),rz=x*Math.sin(n)+z*Math.cos(n);
  const D=b.size+30;sun.position.set(b.cx+rx*D,Math.sin(el)*D,b.cy+rz*D);sun.target.position.set(b.cx,0,b.cy);sun.target.updateMatrixWorld();
  const k=clamp(Math.sin(el)*1.6,0,1);sun.color.copy(col('#ffb070')).lerp(col('#fff4e4'),k);sun.intensity=.9+1.7*k;hemi.intensity=.22+.18*k;renderer.shadowMap.needsUpdate=true;needRender=true;}
function fit3D(){if(!gl3)return;const b=bounds();orb.target.set(b.cx,PROJ?elevs()[PROJ.cur]:0,b.cy);orb.r=b.size*1.45+4;orb.th=.6;orb.ph=.92;needRender=true;}
function size3D(){if(!gl3)return;const r=$('#view3d').getBoundingClientRect();vis3D=r.width>1&&r.height>1;if(!vis3D)return;renderer.setSize(r.width,r.height);camera.aspect=r.width/r.height;camera.updateProjectionMatrix();needRender=true;}
function applyCam(){
  if(camMode==='orbit'){const s=Math.sin(orb.ph);camera.position.set(orb.target.x+orb.r*s*Math.sin(orb.th),orb.target.y+orb.r*Math.cos(orb.ph),orb.target.z+orb.r*s*Math.cos(orb.th));camera.lookAt(orb.target);}
  else{camera.position.copy(walk.pos);const cp=Math.cos(walk.pitch);camera.lookAt(walk.pos.x+Math.sin(walk.yaw)*cp,walk.pos.y+Math.sin(walk.pitch),walk.pos.z+Math.cos(walk.yaw)*cp);}
}
function orbitPan(dx,dy){const k=orb.r*.0016,th=orb.th;orb.target.x+=-dx*k*Math.cos(th)+dy*k*-Math.sin(th);orb.target.z+=dx*k*Math.sin(th)+dy*k*-Math.cos(th);}
function setCam(m){if(!gl3)return;camMode=m;
  if(m==='walk'){const r=M.rooms[0];const c=r?centroid(r.pts):{x:bounds().cx,y:bounds().cy};walk.pos.set(c.x,(PROJ?elevs()[PROJ.cur]:0)+1.6,c.y);walk.yaw=Math.PI;walk.pitch=0;camera.fov=65;}else camera.fov=45;
  camera.updateProjectionMatrix();ceilings.forEach(c=>c.visible=m==='walk');renderer.shadowMap.needsUpdate=true;pending3D=true;
  document.querySelectorAll('[data-cam]').forEach(b=>b.classList.toggle('on',b.dataset.cam===m));$('#pad').hidden=m!=='walk';$('#walkHint').hidden=m!=='walk';needRender=true;}
function bind3D(){
  const el=renderer.domElement,p3=new Map();let g3=null;
  el.style.touchAction='none';
  el.addEventListener('contextmenu',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);p3.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(p3.size===2){const[a,b]=[...p3.values()];g3={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2};}
    else if(p3.size===1)g3={type:(e.button===2||e.shiftKey)?'pan':'rot'};});
  el.addEventListener('pointermove',e=>{if(!p3.has(e.pointerId)||!g3)return;const prev=p3.get(e.pointerId);p3.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(g3.type==='pinch'){if(p3.size<2)return;const[a,b]=[...p3.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      if(camMode==='orbit'){orb.r=clamp(orb.r*g3.d/Math.max(d,1),1.5,300);orbitPan(mx-g3.mx,my-g3.my);}else{const fx=Math.sin(walk.yaw),fz=Math.cos(walk.yaw);walk.pos.x+=fx*(d-g3.d)*.01;walk.pos.z+=fz*(d-g3.d)*.01;}
      g3.d=d;g3.mx=mx;g3.my=my;needRender=true;return;}
    if(g3.type==='none')return;
    const dx=e.clientX-prev.x,dy=e.clientY-prev.y;
    if(camMode==='walk'){walk.yaw-=dx*.004;walk.pitch=clamp(walk.pitch-dy*.004,-1.2,1.2);}
    else if(g3.type==='pan')orbitPan(dx,dy);else{orb.th-=dx*.008;orb.ph=clamp(orb.ph-dy*.008,.12,1.52);}
    needRender=true;});
  const end3=e=>{p3.delete(e.pointerId);if(!p3.size)g3=null;else if(g3&&g3.type==='pinch')g3={type:'none'};};
  el.addEventListener('pointerup',end3);el.addEventListener('pointercancel',end3);
  el.addEventListener('wheel',e=>{e.preventDefault();if(camMode==='orbit')orb.r=clamp(orb.r*Math.exp(e.deltaY*.001),1.5,300);else{const s=-e.deltaY*.003;walk.pos.x+=Math.sin(walk.yaw)*s;walk.pos.z+=Math.cos(walk.yaw)*s;}needRender=true;},{passive:false});
}
document.querySelector('.seg').addEventListener('click',e=>{const b=e.target.closest('[data-cam]');if(b)setCam(b.dataset.cam);});
const pad=$('#pad');
pad.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-move]');if(!b)return;e.preventDefault();b.setPointerCapture(e.pointerId);mv[b.dataset.move]=1;});
['pointerup','pointercancel','pointerleave'].forEach(t=>pad.addEventListener(t,e=>{const b=e.target.closest('[data-move]');if(b)mv[b.dataset.move]=0;}));
const fmtH=h=>`${Math.floor(h)}h${String(Math.round((h%1)*60)).padStart(2,'0')}`;
$('#hour').value=S.hour;$('#north').value=S.north;$('#hourOut').textContent=fmtH(S.hour);
$('#hour').addEventListener('input',e=>{S.hour=Number(e.target.value);$('#hourOut').textContent=fmtH(S.hour);updateSun();save();});
$('#north').addEventListener('input',e=>{S.north=Number(e.target.value);updateSun();drawPlan();save();});
$('#photoBtn').addEventListener('click',()=>{if(!gl3)return;
  const pr=renderer.getPixelRatio();renderer.setPixelRatio(Math.min(3,(window.devicePixelRatio||1)*2));
  sun.shadow.mapSize.set(4096,4096);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}renderer.shadowMap.needsUpdate=true;
  applyCam();renderer.render(scene,camera);const url=renderer.domElement.toDataURL('image/jpeg',.93);
  renderer.setPixelRatio(pr);sun.shadow.mapSize.set(2048,2048);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}renderer.shadowMap.needsUpdate=true;needRender=true;size3D();
  $('#shot').src=url;$('#modal').hidden=false;});
$('#viewSel').addEventListener('change',e=>setView(e.target.value));
$('#closeModal').addEventListener('click',()=>{$('#modal').hidden=true;});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true;});

let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;if(!gl3)return;
  if(pending3D&&vis3D&&(!(gest&&gest.moved)||now-lastBuild>150)){pending3D=false;lastBuild=now;build3D();}
  if(camMode==='walk'){const f=((keys.KeyW||keys.ArrowUp||mv.f)?1:0)-((keys.KeyS||keys.ArrowDown||mv.b)?1:0),st=((keys.KeyD)?1:0)-((keys.KeyA)?1:0),tr=((keys.ArrowRight||mv.r)?1:0)-((keys.ArrowLeft||mv.l)?1:0);
    if(f||st||tr){const fx=Math.sin(walk.yaw),fz=Math.cos(walk.yaw),sp_=1.5*dt;walk.pos.x+=(fx*f-fz*st)*sp_;walk.pos.z+=(fz*f+fx*st)*sp_;walk.yaw-=tr*1.6*dt;needRender=true;}}
  if(needRender&&vis3D){applyCam();renderer.render(scene,camera);needRender=false;}}

/* ---------- Onglets mobile, démarrage ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.body.dataset.tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));requestAnimationFrame(()=>{const first=!PW;resizePlan();if(first)fitPlan();size3D();});});
{const mq=matchMedia('(prefers-color-scheme: dark)'),fn=()=>{readTheme();drawPlan();};if(mq.addEventListener)mq.addEventListener('change',fn);else if(mq.addListener)mq.addListener(fn);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawPlan());
boot();
$('#hour').value=S.hour;$('#north').value=S.north;$('#hourOut').textContent=fmtH(S.hour);
readTheme();init3D();
$('#orthoBtn').classList.toggle('on',S.ortho);
new ResizeObserver(()=>{const first=!PW;if(resizePlan()&&first)fitPlan();size3D();}).observe($('#work'));
setTool('select');
requestAnimationFrame(()=>{resizePlan();fitPlan();size3D();fit3D();updateSun();requestAnimationFrame(loop);});
})();
</script>
